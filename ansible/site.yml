# Cada role carrega uma tag com o proprio nome, para permitir reexecucao
# pontual (ansible-playbook site.yml --tags otel-collector). Sem tag, as roles
# usam include_tasks e os nomes das tasks internas nao existem estaticamente --
# --start-at-task nao consegue alcanca-las.
- name: Setting Up Cluster
  hosts: aws_ec2
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait For SSM Connectivity
      wait_for_connection:
        delay: 15
        timeout: 600
    - name: Gather Facts
      setup:
  roles:
    - { role: hostnames, tags: [hostnames] }
    - { role: dependency-packages, tags: [dependency-packages] }
    - { role: kube-packages, tags: [kube-packages] }
    - { role: container-runtime, tags: [container-runtime] }

- name: Init Cluster
  hosts: control_planes[0]
  become: true
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - { role: init-cluster, tags: [init-cluster] }
    - { role: cloud-controller-manager, tags: [cloud-controller-manager] }
    - { role: set-provider-id, tags: [set-provider-id] }
    - { role: container-network, tags: [container-network] }

- name: Join Control Planes
  hosts: control_planes:!control_planes[0]
  become: true
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - { role: kubelet-extra-args, tags: [kubelet-extra-args] }
    - { role: join-control-planes, tags: [join-control-planes] }
    - { role: set-provider-id, tags: [set-provider-id] }

- name: Join Workers
  hosts: workers
  become: true
  environment:
    KUBECONFIG: "{{ kube_config_worker }}"
  roles:
    - { role: kubelet-extra-args, tags: [kubelet-extra-args] }
    - { role: join-workers, tags: [join-workers] }
    - { role: set-provider-id, tags: [set-provider-id] }

- name: Update Launch Template
  hosts: localhost
  gather_facts: false
  roles:
    - { role: update-launch-template, tags: [update-launch-template] }

- name: Setting Up Cluster Auto Scaler
  hosts: control_planes[0]
  become: true
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - { role: helm, tags: [helm] }
    - { role: node-termination, tags: [node-termination] }
    - { role: cluster-autoscaler, tags: [cluster-autoscaler] }
    - { role: argo-rollouts, tags: [argo-rollouts] }
    - { role: argocd, tags: [argocd] }
    - { role: metrics-server, tags: [metrics-server] }
    - { role: load-balancer-controller, tags: [load-balancer-controller] }
    - { role: container-storage, tags: [container-storage] }
    - { role: external-dns, tags: [external-dns] }
    - { role: fluent-bit, tags: [fluent-bit] }
    - { role: data-prepper, tags: [data-prepper] }
    - { role: otel-collector, tags: [otel-collector] }
