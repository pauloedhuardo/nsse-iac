# O endpoint e as credenciais saem da stack terraform/observability.
# Diferente das outras roles, aqui o terraform output e lido direto para a
# memoria em vez de gravar outputs.json: o output da senha do master user
# vem em claro e nao pode cair no diretorio do repositorio.
- name: Reading Observability Outputs
  shell: terraform output -json
  args:
    chdir: "{{ terraform_path }}/observability"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  register: observability_outputs
  no_log: true

- name: Setting OpenSearch Connection Facts
  set_fact:
    opensearch_endpoint: "{{ (observability_outputs.stdout | from_json).opensearch_domain_endpoint.value }}"
    opensearch_user: "{{ (observability_outputs.stdout | from_json).opensearch_master_user_name.value }}"
    opensearch_password: "{{ (observability_outputs.stdout | from_json).opensearch_master_user_password.value }}"
  no_log: true

- name: Creating Fluent Bit Namespace
  shell: kubectl create namespace {{ fluent_bit_namespace }} --dry-run=client -o yaml | kubectl apply -f -

# A senha vai para um Secret e chega no pod como variavel de ambiente, para
# nao ficar escrita no values.yaml nem no ConfigMap do chart.
- name: Creating OpenSearch Credentials Secret
  shell: >
    kubectl create secret generic {{ fluent_bit_opensearch_secret }}
    --namespace {{ fluent_bit_namespace }}
    --from-literal=user={{ opensearch_user | quote }}
    --from-literal=password={{ opensearch_password | quote }}
    --dry-run=client -o yaml | kubectl apply -f -
  no_log: true
