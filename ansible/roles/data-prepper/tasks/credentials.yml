# O endpoint e as credenciais saem da stack terraform/observability. Igual a
# role fluent-bit, o terraform output e lido direto para a memoria em vez de
# gravar outputs.json: a senha do master user vem em claro e nao pode cair no
# diretorio do repositorio.
- name: Reading Observability Outputs
  shell: terraform output -json
  args:
    chdir: "{{ terraform_path }}/observability"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  register: observability_outputs
  no_log: true

- name: Setting OpenSearch Connection Facts
  set_fact:
    opensearch_endpoint: "{{ (observability_outputs.stdout | from_json).opensearch_domain_endpoint.value }}"
    opensearch_user: "{{ (observability_outputs.stdout | from_json).opensearch_master_user_name.value }}"
    opensearch_password: "{{ (observability_outputs.stdout | from_json).opensearch_master_user_password.value }}"
  no_log: true

# Namespace compartilhado com a role otel-collector. Quem rodar primeiro cria.
- name: Creating Observability Namespace
  shell: kubectl create namespace {{ data_prepper_namespace }} --dry-run=client -o yaml | kubectl apply -f -

# O pipeline carrega a senha do OpenSearch, entao e renderizado em memoria e vai
# direto para um Secret -- nunca encosta em disco no node nem no values.yaml.
# Por isso pipelineConfig.existingSecret no chart em vez de pipelineConfig.config.
- name: Rendering Data Prepper Pipeline
  set_fact:
    data_prepper_pipelines: "{{ lookup('template', 'pipelines.yaml.j2') }}"
  no_log: true

- name: Creating Data Prepper Pipelines Secret
  shell: >
    kubectl create secret generic {{ data_prepper_pipelines_secret }}
    --namespace {{ data_prepper_namespace }}
    --from-literal=pipelines.yaml={{ data_prepper_pipelines | quote }}
    --dry-run=client -o yaml | kubectl apply -f -
  no_log: true
